url: https://joaobtj.github.io/agriclimr/
lang: pt

template:
  bootstrap: 5
  bootswatch: flatly # Um tema limpo, ideal para pacotes científicos

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]
  components:
    articles:
      text: Documentação & Metodologia
      menu:
        - text: "Modelagem do Molhamento Foliar (PT)"
          href: articles/vignette_molhamento_pt.html
        - text: "Leaf Wetness Duration Modeling (EN)"
          href: articles/vignette_leaf_wetness_en.html
        - text: "Geometria Solar e Fotoperíodo com agriclimr"
          href: articles/vignette_solar_pt.html

reference:
  - title: "Solar Geometry"
    desc: "Astronomical solar position and day length calculations."
    contents:
      - estimate_solar_noon
      - estimate_sunrise
      - estimate_sunset
      - estimate_daylength

  - title: "Temperature"
    desc: "Hourly temperature estimation and conversion."
    contents:
      - estimate_hourly_temp
      - daily_to_hourly_temp

  - title: "Relative Humidity"
    desc: "Hourly relative humidity estimation and conversion."
    contents:
      - estimate_hourly_rh
      - daily_to_hourly_rh

  - title: "Leaf Wetness Duration"
    desc: "Leaf wetness duration modeling."
    contents:
      - estimate_lwd_rh
      - daily_to_hourly_lwd

